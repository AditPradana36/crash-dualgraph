mapillary_checkpoint: facebook/mask2former-swin-large-mapillary-vistas-panoptic
node_types:
- ego
- signage
- light_pole
- road_marking
- building
- vegetation
tier1_thing_classes:
- Traffic Light
- Traffic Sign (Front)
- Traffic Sign (Back)
- Traffic Sign Frame
- Street Light
- Pole
- Utility Pole
- Banner
- Billboard
stuff_classes_for_island_labeling:
- Building
- Vegetation
- Crosswalk - Plain
- Lane Marking - General
enclosure_crop_fraction_from_top: 0.4
# FIXED: must be exact Mapillary class name strings (matching segments_info's
# class_name field exactly) — the original lowercase/snake_case version
# silently matched nothing and would have zeroed out Enclosure for every image.
enclosure_classes:
- Building
- Wall
- Fence
- Vegetation
- Traffic Light
- Street Light
- Pole
- Utility Pole
- Traffic Sign (Front)
- Traffic Sign (Back)
- Traffic Sign Frame
- Banner
- Billboard
# Provisional — revisit once real segmented images are visually inspected.
near_cutoff_d: 0.175
mask_confidence_threshold: 0.5
mask_min_area_fraction: 0.0008          # default, used for signage/light_pole/road_marking
mask_min_area_fraction_by_type:
  building: 0.05     # tune these based on visual inspection
  vegetation: 0.05
# REVISED: mounted_with is now triggered by centroid distance ALONE --
# bbox overlap is no longer required (a sign and a light mounted on the
# same pole rarely have overlapping boxes at all; requiring it excluded
# exactly the co-located-but-non-overlapping pairs this relation exists
# to capture -- see src/svg_builder.py's build_mounted_with_edges).
# Deliberately much smaller than near_cutoff_d, since this is meant to
# indicate "physically co-located on the same support," not general
# proximity. PROVISIONAL — please confirm or override, same as the three above.
mounted_with_distance_threshold: 0.04
