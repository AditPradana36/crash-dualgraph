    positive_front_view_dir: /content/drive/MyDrive/crash-dualgraph/data/krakow/positive/front-view
    positive_metadata_csv: /content/drive/MyDrive/crash-dualgraph/data/krakow/positive/points/metadata_outofrange_removed.csv
    positive_points_csv: /content/drive/MyDrive/crash-dualgraph/data/krakow/positive/points/positive_points.csv
