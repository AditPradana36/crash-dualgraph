    positive_metadata_csv: /content/drive/MyDrive/crash-dualgraph/data/somerville/positive/points/metadata_outofrange_removed.csv
    positive_points_csv: /content/drive/MyDrive/crash-dualgraph/data/somerville/positive/points/positive_points.csv
    negative_front_view_dir: /content/drive/MyDrive/crash-dualgraph/data/somerville/negative/front-view
