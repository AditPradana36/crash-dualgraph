    negative_points_csv: /content/drive/MyDrive/crash-dualgraph/data/somerville/negative/points/negative_points.csv

# city_prefix: the "bog_"/"war_"/"kra_"/"som_" codification used for every
# point_id from 01 onward (NOT deferred to a later pooling step like the
# old 2-city pipeline's 05b did) -- needed because interim_dir/processed_dir
# below are now COMBINED across all four cities, not one per city, so
# filenames must be globally unique on their own.
city_prefix:
  bogor: bog
  warsaw: war
  krakow: kra
  somerville: som

# Combined (not per-city) interim/processed roots -- sibling to base_dir,
# i.e. /content/drive/MyDrive/crash-dualgraph/{interim,processed}. Every
# city's 01-04 output lands in ONE shared tree, disambiguated by the
# city-prefixed point_id/filename above rather than by directory.
interim_dir: /content/drive/MyDrive/crash-dualgraph/interim
processed_dir: /content/drive/MyDrive/crash-dualgraph/processed
outputs_dir: /content/drive/MyDrive/crash-dualgraph/outputs

random_seed: 42
approx_n_positive: 2200
approx_n_negative: 2200
