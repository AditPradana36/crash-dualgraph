isovist_radius_m: 50
crash_history_threshold_m: 100
n_rays: 360
bbox_padding_m: 100
network_type: drive
# REVISED: intersection nodes are now STRICTLY isovist-covered -- the
# nearest road edge's endpoints (u/v) are no longer force-included when
# they fall outside the isovist (see src/tvg_builder.py's
# process_incident). on_segment connects to whichever of u/v actually
# qualify, so it can now carry 0, 1, or 2 edges instead of always 2.
#
# REVISED: adjacent (building-building) is now a k-nearest-neighbor graph
# among included buildings (real centroid distance in meters as the edge
# feature), NOT the old full clique among every isovist-included
# building -- a full clique scaled quadratically and didn't distinguish
# "next door" from "across the isovist." adjacent_k_nearest below is that
# k; directed per building (i's k nearest -> i, not forced symmetric).
adjacent_k_nearest: 5
building_shape_metrics:
- area
- perimeter
- circular_compactness
- elongation
- orientation
- shape_index
isovist_shape_metrics:
- area
- compactness
- occlusivity
# Confirmed: no attributes at all — existence + crash_history's distance
# edge feature is the only information a peer carries.
peer_incident_attributes: []
# highway_type_idx is now also a direct Incident node feature (not just
# riding along on on_segment's edge attribute) — categorical, using the
# same GLOBAL highway_vocab built once in osm_fetch.py. Not an ablation:
# negatives were sampled to match positives' highway-type distribution,
# so this doesn't carry crash_history's circularity risk.
incident_highway_feature: true
